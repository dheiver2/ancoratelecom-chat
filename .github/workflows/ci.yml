name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # O repositório ainda não tem ESLint configurado (next lint pede setup
      # interativo na primeira execução). Mantido como best-effort até a
      # configuração ser adicionada, para não travar o pipeline.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
